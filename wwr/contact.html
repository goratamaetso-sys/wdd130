<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wanderlust Rafting Company</title>
    <meta name="description"
      content="Welcome to Gorata Maetso's contact us page for rafting site for WDD130 at BYU. A window into adventure, faith, and discovery.">
    <meta name="author" content="Gorata Maetso">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>

        <img src="images/raft-boat.png" alt="Rafting logo" width="150">

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>Wanderlust Rafting Company</h1>
            <p>246 Molapo Street<br>
                Kolobe, Randburg<br>
                +27 109 208 3076<br>
                <a href="mailto:info@wanderlustrafcomp.com">info@wanderlustrafcomp.com</a>
            </p>
        </section>
        <div class="contact-layout">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114605.04298139391!2d27.96367453906251!3d-26.15085199999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e950d6b1689b351%3A0x3b86514e5cf523cf!2sBespoke%20by%20Barrow%2C%20Oxford%20%26%20Glenhove!5e0!3m2!1sen!2sza!4v1780515166790!5m2!1sen!2sza"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>

            </div>

            <form class="contact-form">

                <div class="form-row">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label for="purpose-general"><input type="radio" id="purpose-general"
                          name="purpose" value="general">General Inquiry</label><br>

                    <label for="purpose-reservation"><input type="radio" id="purpose-reservation"
                          value="reservation"> Reservation
                        Question</label><br>
                    <label for="purpose-suggestion"><input type="radio" id="purpose-suggestion"
                          name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>


                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Type here"
                      required></textarea>
                </div>


                <label for="subscribe" class="newsletter">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>


                <button type="submit">Get in Touch!</button>

            </form>

        </div>
        <section class="profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-container">
                <figure class="employee-profile">
                    <img src="images/employee1.jfif" alt="Lead River Guide">
                    <figcaption>Jane Doe: Lead River Guide</figcaption>
                </figure>
                <figure class="employee-profile">
                    <img src="images/employee2.jfif" alt="Safety Officer">
                    <figcaption>John Smith: Safety Officer</figcaption>
                </figure>
                <figure class="employee-profile">
                    <img src="images/employee3.jfif" alt="Customer Service Manager">
                    <figcaption>Mary Johnson: Customer Service Manager</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026, Wanderlust Rafting Company ♥ Gorata Maetso ♥</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>
</body>

</html>
